name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Instalar dependências
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Cache Bun store e node_modules
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Restore dependências
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies (fallback)
        run: bun install --frozen-lockfile
      - name: Run lint
        run: bun run lint

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Restore dependências
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies (fallback)
        run: bun install --frozen-lockfile
      - name: Typecheck (TypeScript)
        run: bun run typecheck

  test:
    name: Testes com cobertura
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Restore dependências
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies (fallback)
        run: bun install --frozen-lockfile
      - name: Run tests with coverage
        run: bun run test:coverage
      - name: Generate coverage badge
        run: bun run coverage:badge
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: raiz-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Commit coverage badge
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain .github/badges/coverage.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/badges/coverage.svg
            git commit -m "chore: update coverage badge [skip ci]"
            git push
          else
            echo "Badge inalterado."
          fi

  contraste:
    name: Contraste WCAG (axe) em todos os temas
    needs: install
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Restore dependências
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies (fallback)
        run: bun install --frozen-lockfile
      - name: Verificar contraste de ícones, textos e estados do player
        run: bun run test:contraste
      - name: Acessibilidade (axe) das telas do Diário de Reflexão
        run: bun run test:a11y

  seguranca:
    name: Testes de segurança (RLS) com mínimo de cobertura
    needs: install
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Restore dependências
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies (fallback)
        run: bun install --frozen-lockfile
      - name: Rodar suíte de segurança/RLS (falha abaixo do mínimo de cobertura)
        run: bun run test:seguranca:coverage
      - name: Resumo da cobertura de segurança
        if: always()
        run: node scripts/resumo-cobertura-seguranca.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload cobertura de segurança
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-seguranca
          path: coverage-seguranca/
          if-no-files-found: ignore

  isolamento-e2e:
    name: E2E de isolamento de dados (cliente/terapeuta)
    needs: install
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      E2E_BASE_URL: http://localhost:8080
      E2E_EMAIL_CLIENTE: ${{ secrets.E2E_EMAIL_CLIENTE }}
      E2E_SENHA_CLIENTE: ${{ secrets.E2E_SENHA_CLIENTE }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore dependências
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies (fallback)
        run: bun install --frozen-lockfile
      - name: Instalar Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Subir app
        run: |
          bun run dev &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 2; done
      - name: Isolamento de dados por usuário autenticado
        run: bun run test:e2e:isolamento
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-isolamento
          path: e2e/screenshots/
          if-no-files-found: ignore

  performance-abas-e2e:
    name: Performance de troca de abas (390x844)
    needs: install
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      E2E_BASE_URL: http://localhost:8080
      E2E_EMAIL_CLIENTE: ${{ secrets.E2E_EMAIL_CLIENTE }}
      E2E_SENHA_CLIENTE: ${{ secrets.E2E_SENHA_CLIENTE }}
      LOVABLE_BROWSER_SUPABASE_SESSION_JSON: ${{ secrets.LOVABLE_BROWSER_SUPABASE_SESSION_JSON }}
      LOVABLE_BROWSER_SUPABASE_STORAGE_KEY: ${{ secrets.LOVABLE_BROWSER_SUPABASE_STORAGE_KEY }}
      LOVABLE_BROWSER_SUPABASE_COOKIES_JSON: ${{ secrets.LOVABLE_BROWSER_SUPABASE_COOKIES_JSON }}
      E2E_PERF_REPETICOES: "6"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore dependências
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies (fallback)
        run: bun install --frozen-lockfile
      - name: Instalar Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Subir app
        run: |
          bun run dev &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 2; done
      - name: Medir troca de abas e detectar regressões
        if: ${{ env.LOVABLE_BROWSER_SUPABASE_SESSION_JSON != '' }}
        run: bun run test:e2e:performance
      - name: Upload evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-performance-abas
          path: |
            e2e/screenshots/
            e2e/baselines/
          if-no-files-found: ignore

  ci:
    name: CI verde
    needs: [lint, typecheck, test, seguranca, isolamento-e2e, performance-abas-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultados
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "Algum job falhou."
            exit 1
          fi
          echo "Lint, typecheck e testes passaram."
